<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gábio Bank - Cliente GBTP</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; }
        .response { margin-top: 20px; padding: 15px; background: #f4f4f4; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>Gábio Bank</h1>
    
    <!-- Formulário (Tarefa da Ana) -->
    <div id="form-container">
        <div class="form-group">
            <label for="operation">Operação:</label>
            <select id="operation">
                <option value="BALANCE">Saldo (BALANCE)</option>
                <option value="DEPOSIT">Depósito (DEPOSIT)</option>
                <option value="WITHDRAW">Saque (WITHDRAW)</option>
                <option value="TRANSFER">Transferência (TRANSFER)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="accountId">ID da Conta:</label>
            <input type="text" id="accountId" placeholder="Ex: 1234">
        </div>
        <div class="form-group">
            <label for="toAccountId">ID da Conta Destino (Apenas Transferência):</label>
            <input type="text" id="toAccountId" placeholder="Ex: 5678">
        </div>
        <div class="form-group">
            <label for="value">Valor:</label>
            <input type="number" id="value" placeholder="Ex: 100.00" value="0">
        </div>
        <button id="sendBtn">Enviar Operação</button>
    </div>

    <!-- Área de Resposta (Tarefa da Ana) -->
    <div class="response">
        <h3>Resposta do Servidor:</h3>
        <p><strong>Status:</strong> <span id="resStatus">-</span></p>
        <p><strong>Mensagem:</strong> <span id="resMessage">-</span></p>
        <p><strong>Saldo:</strong> <span id="resBalance">-</span></p>
    </div>

    <!-- Script compilado do TypeScript -->
    <script src="dist/main.js" type="module"></script>
</body>
</html>
