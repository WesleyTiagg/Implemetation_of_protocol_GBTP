<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gábio Bank - Cliente GBTP</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <!-- Cabeçalho -->
        <div class="header">
            <h1>Gábio Bank</h1>
            <p>Gabio Bank Transaction Protocol</p>
        </div>

        <!-- Status da conexão -->
        <div class="connection-status" id="connectionStatus">
            <div class="status-dot"></div>
            <span id="connectionText">Conectando ao servidor...</span>
        </div>

        <!-- Formulário -->
        <div id="form-container">
            <div class="form-group">
                <label for="operation">Operação:</label>
                <select id="operation">
                    <option value="BALANCE">Consultar Saldo</option>
                    <option value="DEPOSIT">Depósito</option>
                    <option value="WITHDRAW">Saque</option>
                    <option value="TRANSFER">Transferência</option>
                </select>
            </div>

            <div class="form-group">
                <label for="accountId">ID da Conta:</label>
                <input type="text" id="accountId" placeholder="Ex: 1001">
            </div>

            <!-- Campo destino: só aparece em Transferência -->
            <div class="form-group" id="toAccountGroup">
                <label for="toAccountId">ID da Conta Destino:</label>
                <input type="text" id="toAccountId" placeholder="Ex: 1002">
            </div>

            <div class="form-group">
                <label for="value">Valor (R$):</label>
                <input type="number" id="value" placeholder="Ex: 100.00" value="0" min="0" step="0.01">
            </div>

            <button id="sendBtn">Enviar Operação</button>
        </div>

        <!-- Área de Resposta -->
        <div class="response">
            <h3>Resposta do Servidor</h3>
            <p><strong>Status:</strong> <span id="resStatus">-</span></p>
            <p><strong>Mensagem:</strong> <span id="resMessage">-</span></p>
            <p><strong>Saldo:</strong> R$ <span id="resBalance">-</span></p>
        </div>

    </div>

    <!-- Script compilado do TypeScript -->
    <script src="dist/main.js" type="module"></script>

    <!-- Mostrar/esconder campo destino e status de conexão -->
    <script>
        // Mostra o campo "Conta Destino" só quando a operação é TRANSFER
        document.getElementById('operation').addEventListener('change', function () {
            const toAccountGroup = document.getElementById('toAccountGroup');
            if (this.value === 'TRANSFER') {
                toAccountGroup.classList.add('visible');
            } else {
                toAccountGroup.classList.remove('visible');
            }
        });
    </script>
</body>

</html>
